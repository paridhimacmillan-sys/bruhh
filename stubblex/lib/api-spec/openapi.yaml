openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: batches
    description: Role-aware dispatch batches and public Digital Product Passport records
  - name: leads
    description: Landing-page lead capture
  - name: auth
    description: Passwordless operator authentication
  - name: market
    description: Public lots, buyer commitments, and purchase requests
  - name: orders
    description: Dispatch-side order decisions and fulfillment
  - name: onboarding
    description: Public partner applications and internal StubbleX approval workflow
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List batches
      description: Returns Digital Product Passport batches, newest first.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Batch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/{passportId}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get a public batch passport
      parameters:
        - name: passportId
          in: path
          required: true
          description: Digital Product Passport identifier
          schema:
            type: string
            pattern: ^DPP-[0-9]{4}-[A-Z0-9]+-[0-9]{4}$
            example: DPP-2025-PB07-0431
      responses:
        "200":
          description: Matching batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/id/{batchId}:
    get:
      operationId: getFarmerReceipt
      tags: [batches]
      summary: Get a public farmer payment receipt
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Farmer-facing batch receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerReceipt"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/{passportId}/status:
    patch:
      operationId: updateBatchStatus
      tags: [batches]
      summary: Update an assigned batch status
      security:
        - cookieAuth: []
      parameters:
        - name: passportId
          in: path
          required: true
          schema:
            type: string
            pattern: ^DPP-[0-9]{4}-[A-Z0-9]+-[0-9]{4}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStatusUpdate"
      responses:
        "200":
          description: Updated batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Batch is not assigned to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lots:
    get:
      operationId: listLots
      tags: [market]
      summary: List public marketplace lots
      responses:
        "200":
          description: Lots newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"
  /lots/{lotId}:
    get:
      operationId: getLot
      tags: [market]
      summary: Get a public marketplace lot
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lot detail with linked passports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          description: Lot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /commitment-requests:
    post:
      operationId: createCommitmentRequest
      tags: [market]
      summary: Submit a pre-season volume commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentRequest"
      responses:
        "201":
          description: Commitment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentRequest"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List buyer order requests
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Orders newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [market]
      summary: Request some or all of a marketplace lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Requested volume is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Confirm, reject, or deliver an order
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a landing-page lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLead"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /onboarding-applications:
    post:
      operationId: createOnboardingApplication
      tags: [onboarding]
      summary: Submit a public StubbleX onboarding application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingApplication"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listOnboardingApplications
      tags: [onboarding]
      summary: List onboarding applications for StubbleX staff
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Applications newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingApplication"
        "403":
          description: Staff role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /onboarding/request-otp:
    post:
      operationId: onboardingRequestOtp
      tags: [onboarding]
      summary: Send a phone-verification OTP before an application is submitted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /onboarding/verify-otp:
    post:
      operationId: onboardingVerifyOtp
      tags: [onboarding]
      summary: Verify an applicant phone and receive a short-lived submission token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyOtp" }
      responses:
        "200":
          description: Phone verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingVerification" }
  /onboarding/status:
    get:
      operationId: getOnboardingApplicationStatus
      tags: [onboarding]
      summary: Check a public application using its reference and verified phone
      parameters:
        - name: reference
          in: query
          required: true
          schema: { type: string }
        - name: phone
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public application status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOnboardingStatus" }
  /onboarding-clusters:
    get:
      operationId: listOnboardingClusters
      tags: [onboarding]
      summary: List clusters available for farmer assignment
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Available clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingCluster"
  /onboarding-applications/{applicationId}/status:
    patch:
      operationId: updateOnboardingApplicationStatus
      tags: [onboarding]
      summary: Update an onboarding review status
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
  /onboarding-applications/{applicationId}/approve:
    post:
      operationId: approveOnboardingApplication
      tags: [onboarding]
      summary: Approve an applicant and create the appropriate enrollment or account
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOnboardingApplication"
      responses:
        "200":
          description: Approved application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "409":
          description: Application cannot be approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /onboarding-applications/{applicationId}/reject:
    post:
      operationId: rejectOnboardingApplication
      tags: [onboarding]
      summary: Reject an application with a recorded reason
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOnboardingApplication"
      responses:
        "200":
          description: Rejected application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
  /onboarding-applications/{applicationId}/history:
    get:
      operationId: listOnboardingApplicationHistory
      tags: [onboarding]
      summary: View the immutable review audit trail
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingEvent" }
  /onboarding-applications/{applicationId}/documents:
    get:
      operationId: listOnboardingApplicationDocuments
      tags: [onboarding]
      summary: List submitted verification documents for staff review
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Submitted document metadata and secure staff-only content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingDocument" }
    post:
      operationId: uploadOnboardingApplicationDocument
      tags: [onboarding]
      summary: Upload a verification document as an inspector or StubbleX reviewer
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingDocumentUpload" }
      responses:
        "201":
          description: Inspector document stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingDocument" }
  /onboarding-applications/{applicationId}/inspections:
    get:
      operationId: listOnboardingApplicationInspections
      tags: [onboarding]
      summary: List recorded field inspections
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Field inspection records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingInspection" }
    post:
      operationId: createOnboardingApplicationInspection
      tags: [onboarding]
      summary: Record an inspector field visit and recommendation
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOnboardingInspection" }
      responses:
        "201":
          description: Inspection recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingInspection" }
  /auth/request-otp:
    post:
      operationId: authRequestOtp
      tags: [auth]
      summary: Request an operator OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneRequest"
      responses:
        "202":
          description: OTP request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid mobile number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: OTP request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-otp:
    post:
      operationId: authVerifyOtp
      tags: [auth]
      summary: Verify an OTP and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
      responses:
        "200":
          description: Authenticated operator
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification attempt limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the authenticated operator
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Clear the operator session
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: stubblex_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BatchStatus:
      type: string
      enum: [registered, baled, paid, delivered]
    BatchStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/BatchStatus"
        simulateNotification:
          type: boolean
          default: false
          description: Update status without sending the production farmer SMS; used only by the dispatch visual demo.
      required: [status]
    Batch:
      type: object
      properties:
        id:
          type: integer
        passportId:
          type: string
          example: DPP-2025-PB07-0431
        clusterId:
          type: integer
        farmerId:
          type: integer
        assignedOperatorId:
          type: [integer, "null"]
        weightTonnes:
          type: number
          format: double
          example: 4.2
        moisturePct:
          type: number
          format: double
          example: 10.8
        baledAt:
          type: string
          format: date-time
        weighbridgeId:
          type: string
          example: WB-SUN-114
        farmerPaidInr:
          type: integer
          example: 1680
        salePriceInrPerTonne:
          type: integer
          description: Fixed pilot sale price applied to demo batches.
          example: 1700
        buyerName:
          type: string
        deliveredAt:
          type: [string, "null"]
          format: date-time
        distanceKm:
          type: integer
          maximum: 49
        status:
          $ref: "#/components/schemas/BatchStatus"
      required:
        - id
        - passportId
        - clusterId
        - farmerId
        - assignedOperatorId
        - weightTonnes
        - moisturePct
        - baledAt
        - weighbridgeId
        - farmerPaidInr
        - salePriceInrPerTonne
        - buyerName
        - deliveredAt
        - distanceKm
        - status
    FarmerReceipt:
      type: object
      properties:
        id: { type: integer }
        passportId: { type: string }
        clusterName: { type: string }
        weightTonnes: { type: number }
        farmerPaidInr: { type: integer }
        paymentDate: { type: string, format: date-time }
        baledAt: { type: string, format: date-time }
        weighbridgeId: { type: string }
        status: { $ref: "#/components/schemas/BatchStatus" }
      required: [id, passportId, clusterName, weightTonnes, farmerPaidInr, paymentDate, baledAt, weighbridgeId, status]
    LotStatus:
      type: string
      enum: [available, requested, committed, sold]
    Lot:
      type: object
      properties:
        id: { type: string, example: LOT-SGR-2501 }
        yardId: { type: integer }
        yardName: { type: string }
        yardDistrict: { type: string }
        yardLat: { type: number }
        yardLng: { type: number }
        clusterId: { type: integer }
        clusterName: { type: string }
        clusterDistrict: { type: string }
        tonnes: { type: number }
        moisturePct: { type: number }
        priceInrPerTonne: { type: integer }
        status: { $ref: "#/components/schemas/LotStatus" }
        listedAt: { type: string, format: date-time }
        baledAt: { type: string, format: date-time }
        label: { type: [string, "null"] }
        passportIds:
          type: array
          items: { type: string }
      required: [id, yardId, yardName, yardDistrict, yardLat, yardLng, clusterId, clusterName, clusterDistrict, tonnes, moisturePct, priceInrPerTonne, status, listedAt, baledAt, label, passportIds]
    IndustryType:
      type: string
      enum: [CBG, pellet, boiler, board, other]
    CreateCommitmentRequest:
      type: object
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        industryType: { $ref: "#/components/schemas/IndustryType" }
        volumeTonnes: { type: number, exclusiveMinimum: 0 }
        preferredWindow: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: "^[+]?[0-9 ()-]{7,20}$" }
      required: [companyName, industryType, volumeTonnes, preferredWindow, phone]
    CommitmentRequest:
      allOf:
        - $ref: "#/components/schemas/CreateCommitmentRequest"
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
          required: [id, createdAt]
    OrderStatus:
      type: string
      enum: [requested, confirmed, rejected, delivered]
    CreateOrder:
      type: object
      additionalProperties: false
      properties:
        lotId: { type: string }
        company: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, pattern: "^[+]?[0-9 ()-]{7,20}$" }
        tonnes: { type: number, exclusiveMinimum: 0 }
      required: [lotId, company, phone, tonnes]
    Order:
      type: object
      properties:
        id: { type: integer }
        lotId: { type: string }
        lotTonnes: { type: number }
        company: { type: string }
        phone: { type: string }
        tonnes: { type: number }
        status: { $ref: "#/components/schemas/OrderStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, lotId, lotTonnes, company, phone, tonnes, status, createdAt, updatedAt]
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [confirmed, rejected, delivered]
      required: [status]
    LeadRole:
      type: string
      enum: [farmer, buyer, operator]
    CreateLead:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: ^[+]?[0-9 ()-]{7,20}$
          example: "+91 98765 43210"
        role:
          $ref: "#/components/schemas/LeadRole"
      required:
        - name
        - phone
        - role
    Lead:
      allOf:
        - $ref: "#/components/schemas/CreateLead"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - createdAt
    OnboardingApplicantType:
      type: string
      enum: [farmer, machine_partner, logistics_operator, buyer]
    OnboardingCluster:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        district: { type: string }
        acres: { type: integer }
      required: [id, name, district, acres]
    OnboardingStatus:
      type: string
      enum: [new, contacted, documents_pending, verified, approved, rejected, waitlisted]
    MachineType:
      type: string
      enum: [baler, rake, tractor, loader, truck, other]
    CreateOnboardingApplication:
      type: object
      additionalProperties: false
      properties:
        applicantType:
          $ref: "#/components/schemas/OnboardingApplicantType"
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: ^[+]?[0-9 ()-]{7,20}$
        district:
          type: string
          minLength: 2
          maxLength: 100
        applicationData:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: "null"
        verificationToken:
          type: string
          minLength: 20
        documents:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/OnboardingDocumentUpload" }
      required: [applicantType, name, phone, district, applicationData]
    OnboardingApplication:
      allOf:
        - $ref: "#/components/schemas/CreateOnboardingApplication"
        - type: object
          properties:
            id: { type: integer }
            reference: { type: string }
            status: { $ref: "#/components/schemas/OnboardingStatus" }
            assignedCoordinatorId: { type: [integer, "null"] }
            reviewedByUserId: { type: [integer, "null"] }
            reviewNotes: { type: [string, "null"] }
            phoneVerifiedAt: { type: string, format: date-time }
            appliedAt: { type: string, format: date-time }
            reviewedAt: { type: [string, "null"], format: date-time }
          required: [id, reference, status, assignedCoordinatorId, reviewedByUserId, reviewNotes, phoneVerifiedAt, appliedAt, reviewedAt]
    OnboardingDocumentUpload:
      type: object
      additionalProperties: false
      properties:
        documentType: { type: string, minLength: 2, maxLength: 60 }
        fileName: { type: string, minLength: 1, maxLength: 180 }
        mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 2097152 }
        fileDataBase64: { type: string, minLength: 4, maxLength: 2800000 }
      required: [documentType, fileName, mimeType, sizeBytes, fileDataBase64]
    OnboardingDocument:
      allOf:
        - $ref: "#/components/schemas/OnboardingDocumentUpload"
        - type: object
          properties:
            id: { type: integer }
            applicationId: { type: integer }
            source: { type: string, enum: [applicant, inspector] }
            uploadedByUserId: { type: [integer, "null"] }
            uploadedAt: { type: string, format: date-time }
          required: [id, applicationId, source, uploadedByUserId, uploadedAt]
    InspectionRecommendation:
      type: string
      enum: [recommended, revisit_required, not_eligible]
    CreateOnboardingInspection:
      type: object
      additionalProperties: false
      properties:
        visitedAt: { type: string, format: date-time }
        observedAcres: { type: number, exclusiveMinimum: 0 }
        estimatedTonnes: { type: number, exclusiveMinimum: 0 }
        fieldLocation: { type: string, minLength: 2, maxLength: 240 }
        fieldNotes: { type: string, minLength: 3, maxLength: 2000 }
        recommendation: { $ref: "#/components/schemas/InspectionRecommendation" }
      required: [visitedAt, observedAcres, estimatedTonnes, fieldLocation, fieldNotes, recommendation]
    OnboardingInspection:
      allOf:
        - $ref: "#/components/schemas/CreateOnboardingInspection"
        - type: object
          properties:
            id: { type: integer }
            applicationId: { type: integer }
            inspectorUserId: { type: integer }
            inspectorName: { type: string }
            createdAt: { type: string, format: date-time }
          required: [id, applicationId, inspectorUserId, inspectorName, createdAt]
    OnboardingVerification:
      type: object
      properties:
        verificationToken: { type: string }
        message: { type: string }
      required: [verificationToken, message]
    PublicOnboardingStatus:
      type: object
      properties:
        reference: { type: string }
        name: { type: string }
        applicantType: { $ref: "#/components/schemas/OnboardingApplicantType" }
        status: { $ref: "#/components/schemas/OnboardingStatus" }
        appliedAt: { type: string, format: date-time }
        statusMessage: { type: string }
      required: [reference, name, applicantType, status, appliedAt, statusMessage]
    OnboardingEvent:
      type: object
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        action: { type: string }
        fromStatus: { oneOf: [{ $ref: "#/components/schemas/OnboardingStatus" }, { type: "null" }] }
        toStatus: { oneOf: [{ $ref: "#/components/schemas/OnboardingStatus" }, { type: "null" }] }
        actorUserId: { type: [integer, "null"] }
        actorName: { type: [string, "null"] }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, applicationId, action, fromStatus, toStatus, actorUserId, actorName, note, createdAt]
    OnboardingStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [contacted, documents_pending, verified, waitlisted]
        reviewNotes:
          type: [string, "null"]
          maxLength: 1000
      required: [status]
    ApproveOnboardingApplication:
      type: object
      additionalProperties: false
      properties:
        assignedClusterId:
          type: [integer, "null"]
          minimum: 1
        reviewNotes:
          type: [string, "null"]
          maxLength: 1000
    RejectOnboardingApplication:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required: [reason]
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    UserRole:
      type: string
      enum: [operator, aggregator, inspector, coordinator, admin]
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
          pattern: ^[6-9][0-9]{9}$
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
      required: [id, phone, name, role]
    PhoneRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: ^[6-9][0-9]{9}$
          example: "9876500003"
      required: [phone]
    VerifyOtp:
      allOf:
        - $ref: "#/components/schemas/PhoneRequest"
        - type: object
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: ^[0-9]{6}$
          required: [code]
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
