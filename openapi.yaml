openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: batches
    description: Role-aware dispatch batches and public Digital Product Passport records
  - name: leads
    description: Landing-page lead capture
  - name: auth
    description: Passwordless operator authentication
  - name: market
    description: Public lots, buyer commitments, and purchase requests
  - name: orders
    description: Dispatch-side order decisions and fulfillment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List batches
      description: Returns Digital Product Passport batches, newest first.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Batch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/{passportId}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get a public batch passport
      parameters:
        - name: passportId
          in: path
          required: true
          description: Digital Product Passport identifier
          schema:
            type: string
            pattern: ^DPP-[0-9]{4}-[A-Z0-9]+-[0-9]{4}$
            example: DPP-2025-PB07-0431
      responses:
        "200":
          description: Matching batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/id/{batchId}:
    get:
      operationId: getFarmerReceipt
      tags: [batches]
      summary: Get a public farmer payment receipt
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Farmer-facing batch receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerReceipt"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batches/{passportId}/status:
    patch:
      operationId: updateBatchStatus
      tags: [batches]
      summary: Update an assigned batch status
      security:
        - cookieAuth: []
      parameters:
        - name: passportId
          in: path
          required: true
          schema:
            type: string
            pattern: ^DPP-[0-9]{4}-[A-Z0-9]+-[0-9]{4}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStatusUpdate"
      responses:
        "200":
          description: Updated batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Batch is not assigned to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lots:
    get:
      operationId: listLots
      tags: [market]
      summary: List public marketplace lots
      responses:
        "200":
          description: Lots newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"
  /lots/{lotId}:
    get:
      operationId: getLot
      tags: [market]
      summary: Get a public marketplace lot
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lot detail with linked passports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          description: Lot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /commitment-requests:
    post:
      operationId: createCommitmentRequest
      tags: [market]
      summary: Submit a pre-season volume commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentRequest"
      responses:
        "201":
          description: Commitment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentRequest"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List buyer order requests
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Orders newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [market]
      summary: Request some or all of a marketplace lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Requested volume is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Confirm, reject, or deliver an order
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a landing-page lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLead"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/request-otp:
    post:
      operationId: authRequestOtp
      tags: [auth]
      summary: Request an operator OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneRequest"
      responses:
        "202":
          description: OTP request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid mobile number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: OTP request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-otp:
    post:
      operationId: authVerifyOtp
      tags: [auth]
      summary: Verify an OTP and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
      responses:
        "200":
          description: Authenticated operator
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification attempt limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the authenticated operator
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Clear the operator session
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: stubblex_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BatchStatus:
      type: string
      enum: [registered, baled, paid, delivered]
    BatchStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/BatchStatus"
        simulateNotification:
          type: boolean
          default: false
          description: Update status without sending the production farmer SMS; used only by the dispatch visual demo.
      required: [status]
    Batch:
      type: object
      properties:
        id:
          type: integer
        passportId:
          type: string
          example: DPP-2025-PB07-0431
        clusterId:
          type: integer
        farmerId:
          type: integer
        assignedOperatorId:
          type: [integer, "null"]
        weightTonnes:
          type: number
          format: double
          example: 4.2
        moisturePct:
          type: number
          format: double
          example: 10.8
        baledAt:
          type: string
          format: date-time
        weighbridgeId:
          type: string
          example: WB-SUN-114
        farmerPaidInr:
          type: integer
          example: 1680
        salePriceInrPerTonne:
          type: integer
          description: Fixed pilot sale price applied to demo batches.
          example: 1700
        buyerName:
          type: string
        deliveredAt:
          type: [string, "null"]
          format: date-time
        distanceKm:
          type: integer
          maximum: 49
        status:
          $ref: "#/components/schemas/BatchStatus"
      required:
        - id
        - passportId
        - clusterId
        - farmerId
        - assignedOperatorId
        - weightTonnes
        - moisturePct
        - baledAt
        - weighbridgeId
        - farmerPaidInr
        - salePriceInrPerTonne
        - buyerName
        - deliveredAt
        - distanceKm
        - status
    FarmerReceipt:
      type: object
      properties:
        id: { type: integer }
        passportId: { type: string }
        clusterName: { type: string }
        weightTonnes: { type: number }
        farmerPaidInr: { type: integer }
        paymentDate: { type: string, format: date-time }
        baledAt: { type: string, format: date-time }
        weighbridgeId: { type: string }
        status: { $ref: "#/components/schemas/BatchStatus" }
      required: [id, passportId, clusterName, weightTonnes, farmerPaidInr, paymentDate, baledAt, weighbridgeId, status]
    LotStatus:
      type: string
      enum: [available, requested, committed, sold]
    Lot:
      type: object
      properties:
        id: { type: string, example: LOT-SGR-2501 }
        yardId: { type: integer }
        yardName: { type: string }
        yardDistrict: { type: string }
        yardLat: { type: number }
        yardLng: { type: number }
        clusterId: { type: integer }
        clusterName: { type: string }
        clusterDistrict: { type: string }
        tonnes: { type: number }
        moisturePct: { type: number }
        priceInrPerTonne: { type: integer }
        status: { $ref: "#/components/schemas/LotStatus" }
        listedAt: { type: string, format: date-time }
        baledAt: { type: string, format: date-time }
        label: { type: [string, "null"] }
        passportIds:
          type: array
          items: { type: string }
      required: [id, yardId, yardName, yardDistrict, yardLat, yardLng, clusterId, clusterName, clusterDistrict, tonnes, moisturePct, priceInrPerTonne, status, listedAt, baledAt, label, passportIds]
    IndustryType:
      type: string
      enum: [CBG, pellet, boiler, board, other]
    CreateCommitmentRequest:
      type: object
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 2, maxLength: 160 }
        industryType: { $ref: "#/components/schemas/IndustryType" }
        volumeTonnes: { type: number, exclusiveMinimum: 0 }
        preferredWindow: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: "^[+]?[0-9 ()-]{7,20}$" }
      required: [companyName, industryType, volumeTonnes, preferredWindow, phone]
    CommitmentRequest:
      allOf:
        - $ref: "#/components/schemas/CreateCommitmentRequest"
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
          required: [id, createdAt]
    OrderStatus:
      type: string
      enum: [requested, confirmed, rejected, delivered]
    CreateOrder:
      type: object
      additionalProperties: false
      properties:
        lotId: { type: string }
        company: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, pattern: "^[+]?[0-9 ()-]{7,20}$" }
        tonnes: { type: number, exclusiveMinimum: 0 }
      required: [lotId, company, phone, tonnes]
    Order:
      type: object
      properties:
        id: { type: integer }
        lotId: { type: string }
        lotTonnes: { type: number }
        company: { type: string }
        phone: { type: string }
        tonnes: { type: number }
        status: { $ref: "#/components/schemas/OrderStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, lotId, lotTonnes, company, phone, tonnes, status, createdAt, updatedAt]
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [confirmed, rejected, delivered]
      required: [status]
    LeadRole:
      type: string
      enum: [farmer, buyer, operator]
    CreateLead:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: ^[+]?[0-9 ()-]{7,20}$
          example: "+91 98765 43210"
        role:
          $ref: "#/components/schemas/LeadRole"
      required:
        - name
        - phone
        - role
    Lead:
      allOf:
        - $ref: "#/components/schemas/CreateLead"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - createdAt
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    UserRole:
      type: string
      enum: [operator, aggregator, coordinator, admin]
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
          pattern: ^[6-9][0-9]{9}$
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
      required: [id, phone, name, role]
    PhoneRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: ^[6-9][0-9]{9}$
          example: "9876500003"
      required: [phone]
    VerifyOtp:
      allOf:
        - $ref: "#/components/schemas/PhoneRequest"
        - type: object
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: ^[0-9]{6}$
          required: [code]
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
